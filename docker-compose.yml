services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bigmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigmind}
      POSTGRES_DB: ${POSTGRES_DB:-bigmind}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - bigmind-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bigmind}']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  bigmind-postgres:
