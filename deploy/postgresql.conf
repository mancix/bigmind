# BigMind PostgreSQL 16 configuration
# Tuned for modest hardware (e.g. ASRock J3710, 8GB RAM, SSD, Debian 13).
#
# Usage: copy to /etc/postgresql/16/main/postgresql.conf.d/99-bigmind.conf
#        (or append the relevant lines to postgresql.conf), then
#        systemctl restart postgresql@16-main
#
# Values below only override the parts that matter for this workload.
# All other parameters keep the distribution defaults.

# --- Memory ---------------------------------------------------------------
# 8GB total on the box. Keep headroom for the Node API and OS.
shared_buffers = 256MB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 64MB

# --- Connections ----------------------------------------------------------
# The API pool uses max 10 connections; 30 leaves room for maintenance/tools.
max_connections = 30

# --- CPU ------------------------------------------------------------------
# Atom-class CPU: JIT overhead outweighs its benefit for small OLTP queries.
jit = off
# Keep parallel query minimal on a 4-core low-clocked CPU.
max_parallel_workers_per_gather = 1
max_parallel_workers = 2

# --- Planner / I/O ----------------------------------------------------------
# Data lives on SSD.
random_page_cost = 1.1
effective_io_concurrency = 200

# --- WAL / checkpoints ------------------------------------------------------
# Fewer, larger checkpoints reduce write spikes on a modest SSD.
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# --- Autovacuum --------------------------------------------------------------
# Defaults are fine; autovacuum keeps bloat in check on the sync tables.
autovacuum = on

# --- Monitoring ---------------------------------------------------------------
# Enables pg_stat_statements for finding slow queries.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = 'all'

# --- Logging (quiet by default to reduce I/O) ----------------------------------
log_min_duration_statement = 1000